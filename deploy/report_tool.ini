[program:report_tool]
directory=/root/report_tool
command=/root/report_tool/.venv/bin/python3 /root/report_tool/main.py
user=root
environment=APP_RELOAD="false"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/1panel/tools/supervisord/log/report_tool.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
